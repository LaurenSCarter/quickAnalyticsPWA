<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2196F3">
    <title>Quick Analytics - Doom Scroll Tracker</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- iOS PWA Support -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Quick Analytics">

    <link rel="icon" href="/icons/favicon.ico" />

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="header-left">
                <img src="icons/logo-zinc.svg" alt="Quick Analytics Logo" class="header-logo">
                <h1>Doom Scroll Tracker</h1>
            </div>
            <div class="status-indicator">
                <span id="online-status" class="status online">●</span>
                <span id="status-text">Online</span>
            </div>
        </header>

        <div class="page-nav">
            <a href="index.html">← Home</a>
            <a href="reports.html" class="dashboard-link">View Reports →</a>
        </div>

        <main>
            <form id="doom-scroll-form" class="entry-form">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="start-time">Start Time</label>
                        <input type="time" id="start-time" name="startTime" required>
                    </div>

                    <div class="form-group">
                        <label for="end-time">End Time</label>
                        <input type="time" id="end-time" name="endTime" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="driving-emotion">Driving Emotion (select multiple)</label>
                    <select id="driving-emotion" name="drivingEmotion" multiple required size="7">
                        <option value="bored">Bored</option>
                        <option value="sad">Sad</option>
                        <option value="excited">Excited</option>
                        <option value="disturbed">Disturbed</option>
                        <option value="angry">Angry</option>
                        <option value="frustrated">Frustrated</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group" id="custom-driving-emotion-group" style="display: none;">
                    <label for="custom-driving-emotion">Custom Driving Emotion</label>
                    <input type="text" id="custom-driving-emotion" name="customDrivingEmotion" placeholder="Enter your emotion">
                </div>

                <div class="form-group">
                    <label for="driving-emotion-intensity">Driving Emotion Intensity</label>
                    <input type="range" id="driving-emotion-intensity" name="drivingEmotionIntensity" min="0" max="10" value="5" class="energy-slider" required>
                    <div class="energy-labels">
                        <span>Low (0)</span>
                        <span id="driving-intensity-value">5</span>
                        <span>High (10)</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="resulting-emotion">Resulting Emotion (select multiple)</label>
                    <select id="resulting-emotion" name="resultingEmotion" multiple required size="6">
                        <option value="empty">Empty</option>
                        <option value="sad">Sad</option>
                        <option value="depressed">Depressed</option>
                        <option value="unfulfilled">Unfulfilled</option>
                        <option value="self righteous">Self Righteous</option>
                        <option value="vindicated">Vindicated</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group" id="custom-resulting-emotion-group" style="display: none;">
                    <label for="custom-resulting-emotion">Custom Resulting Emotion</label>
                    <input type="text" id="custom-resulting-emotion" name="customResultingEmotion" placeholder="Enter your emotion">
                </div>

                <div class="form-group">
                    <label for="resulting-emotion-intensity">Resulting Emotion Intensity</label>
                    <input type="range" id="resulting-emotion-intensity" name="resultingEmotionIntensity" min="0" max="10" value="5" class="energy-slider" required>
                    <div class="energy-labels">
                        <span>Low (0)</span>
                        <span id="resulting-intensity-value">5</span>
                        <span>High (10)</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="app">App</label>
                    <select id="app" name="app" required>
                        <option value="">Select App</option>
                        <option value="youTube">YouTube</option>
                        <option value="reddit">Reddit</option>
                        <option value="facebook">Facebook</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group" id="custom-app-group" style="display: none;">
                    <label for="custom-app">Custom App</label>
                    <input type="text" id="custom-app" name="customApp" placeholder="Enter app name">
                </div>

                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" name="notes" placeholder="Any additional context..." rows="3"></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    <span class="btn-text">Log Doom Scroll Session</span>
                    <span class="btn-spinner" style="display: none;">⏳</span>
                </button>
            </form>

            <div id="message" class="message" style="display: none;"></div>

            <div class="pending-entries" id="pending-entries" style="display: none;">
                <h3>Pending Sync</h3>
                <div id="pending-list"></div>
                <button id="sync-now" class="sync-btn">Sync Now</button>
            </div>
        </main>
    </div>

    <script src="constants.js"></script>
    <script src="doomScroll.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('SW registered'))
                    .catch(error => console.log('SW registration failed'));
            });
        }
    </script>
</body>

</html>
